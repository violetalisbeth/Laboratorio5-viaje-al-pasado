name: CI - Build, Tests and Smoke Test

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Grant execute permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Build and run tests
        run: ./mvnw clean verify -B

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          if-no-files-found: warn

  smoke-test-compose:
    name: Smoke test with Docker Compose
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create test environment file
        run: |
          cat <<'EOF' > .env
          DATABASE_NAME=laboratorio3_ci
          DATABASE_USERNAME=ci_user
          DATABASE_PASSWORD=ci_password
          EOF

      - name: Start Docker Compose
        run: docker compose up --build -d

      - name: Wait for application
        run: |
          for i in {1..20}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:8080/api/specimens/getAll || true)

            if [ "$STATUS" != "000" ]; then
              echo "The application responded with HTTP status $STATUS."
              exit 0
            fi

            echo "Waiting for the application... ($i/20)"
            sleep 3
          done

          echo "The application never responded on time."
          exit 1

      - name: Run smoke test
        run: |
          echo "Creating test specimen..."

          curl --fail --show-error --silent \
            -X POST \
            http://localhost:8080/api/specimens/create \
            -H "Content-Type: application/json" \
            -d '{
              "name": "Bokoblin CI",
              "region": "Central Hyrule",
              "dangerLevel": 5,
              "isFriendly": false
            }'

          echo ""
          echo "Consulting registered specimens..."

          curl --fail --show-error --silent \
            http://localhost:8080/api/specimens/getAll

          echo ""
          echo "Smoke test completed successfully."

      - name: Show Docker logs
        if: failure()
        run: docker compose logs

      - name: Shutdown containers
        if: always()
        run: docker compose down -v